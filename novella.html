<style>
:root{color-scheme:dark;--paper:#ebe0cf;--dim:#b5a99b;--ink:#11151a;--amber:#ebba79;--line:#ffffff29;--pad:clamp(14px,4vw,72px);--scale:1}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#11151a;color:var(--paper);font-family:system-ui,sans-serif;touch-action:manipulation;user-select:none}
button,input{font:inherit} button{min-height:44px;border:1px solid var(--line);border-radius:2px;color:var(--paper);background:#151719;padding:8px 16px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px} button:active{background:#423126} button:disabled{color:#c0b5a4;opacity:.48;cursor:default} button.primary{border-color:var(--amber);color:#1a130d;background:var(--amber);font-weight:650}
button.slim{background:#111519c9;padding:4px 12px}
#game{height:100vh;height:100dvh;position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 65% 38%,#35404a,#10131b 68%)}
#world,.backdrop,#cast,#illustration,#vignette{position:absolute;inset:0;pointer-events:none}
.backdrop,#illustration{background-size:cover;background-position:center;transition:opacity .55s;background-repeat:no-repeat}
.backdrop{filter:saturate(.84) brightness(.78)}
.snow-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#vignette{background:linear-gradient(0deg,#06090fc7,transparent 44%,transparent 77%,#05090b77),radial-gradient(ellipse at center,transparent 45%,#080b10a8)}
#world.uneasy #vignette{background:radial-gradient(ellipse,#0000 34%,#180c10e0),linear-gradient(0deg,#06060b9e,transparent 60%)}
#world.shake{animation:rumble .3s ease-in-out} @keyframes rumble{25%{transform:translate(-5px,2px)}50%{transform:translate(5px,-2px)}75%{transform:translate(-2px,0)}}
#cast{display:grid;grid-template-columns:repeat(3,1fr);padding-inline:clamp(6px,4vw,64px);align-items:start;top:clamp(44px,10dvh,76px);overflow:hidden}
#cast img{grid-row:1;width:100%;height:max(136dvh,400px);object-fit:contain;object-position:center top;filter:drop-shadow(0 4px 15px #020305aa);transition:opacity .25s}
#castLeft{grid-column:1} #castCenter{grid-column:2} #castRight{grid-column:3}
#cast img:not(.active){filter:brightness(.69) drop-shadow(0 4px 15px #020305aa)}
#illustration{z-index:3;opacity:0;background-color:#12151c}
#illustration.show{opacity:1} #flash{position:absolute;inset:0;z-index:12;background:#ede2c9;pointer-events:none;opacity:0}
#world:has(#illustration.show.snow-illustration) #snowForeground{z-index:4}
#flash.hit{animation:blink .36s ease-out} @keyframes blink{0%{opacity:.48}100%{opacity:0}}
.screen{position:absolute;z-index:6;inset:0;display:flex;align-items:center;justify-content:center;padding:clamp(14px,5vh,45px) max(var(--pad),env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(var(--pad),env(safe-area-inset-left));background:linear-gradient(90deg,#090d13ed,#090d1359 67%,#090d1325)}
.screen.center{background:#090d13ad}
.cover{margin-right:auto;max-width:580px}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.19em;color:var(--amber);margin:0 0 1rem;font-weight:650}
h1,h2{font-family:Georgia,serif;font-weight:400;margin:0 0 .35em;line-height:1.04}
h1{font-size:clamp(60px,16dvh,162px);letter-spacing:-.08em} h2{font-size:clamp(25px,6dvh,52px)}
.cover>p:not(.eyebrow),.sheet>p{line-height:1.55;color:var(--dim)}
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:8px;margin-top:1rem}
.sheet{background:#161a20f5;border:1px solid #ffffff2b;border-top:2px solid #ae855e;max-width:620px;width:100%;max-height:100%;overflow:auto;padding:clamp(16px,4dvh,38px);box-shadow:0 16px 65px #0009}
.sheet footer{margin-top:1rem;display:flex;gap:8px;flex-wrap:wrap}
#hud{position:absolute;z-index:5;top:max(0px,env(safe-area-inset-top));left:max(var(--pad),env(safe-area-inset-left));right:max(var(--pad),env(safe-area-inset-right));display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:5px}
#chapterLabel{font:1rem Georgia,serif;letter-spacing:.15em;color:var(--amber);margin-right:7px;text-shadow:0 2px 3px #000}
#stats{font-size:.78rem;background:#111519de;border:1px solid var(--line);padding:6px 9px;display:flex;gap:9px;flex-wrap:wrap} #hud .spacer{flex:1}
#dialogueDock{z-index:4;position:absolute;bottom:max(11px,env(safe-area-inset-bottom));left:max(var(--pad),env(safe-area-inset-left));right:max(var(--pad),env(safe-area-inset-right));pointer-events:none;display:grid;gap:5px}
#dialogueDock>*{pointer-events:auto}
#statusRack{display:none;justify-self:start;max-width:100%;gap:4px;flex-direction:column}
#dialogueDock:has(#dialogue:not([hidden]),#choices:not([hidden])) #statusRack{display:flex}
.status-strip,.stat-flashes{display:flex;gap:5px;flex-wrap:wrap}
.status-strip span,.stat-flash{padding:4px 9px;border:1px solid #dcc39b39;background:#10171cec;color:var(--paper);font-size:clamp(.72rem,2.7dvh,.91rem);line-height:1.15}
.stat-flash{border-color:currentColor;color:#bbefcf;background:#16342a;font-weight:680}
.stat-flash.loss{color:#ffc1ad;background:#3e2724}
#dialogue{position:relative;padding:clamp(12px,3dvh,24px) clamp(16px,3vw,35px) clamp(13px,3dvh,25px);min-height:clamp(96px,24dvh,176px);background:linear-gradient(112deg,#12181ef7,#14191ff0);border:1px solid var(--line);border-top:1px solid #be966bba;box-shadow:0 10px 46px #0006;cursor:pointer}
#speaker{font-size:clamp(12px,2.6dvh,17px);font-weight:700;color:var(--amber);letter-spacing:.14em;text-transform:uppercase;margin:0 0 7px}
#line{margin:0 24px 0 0;max-width:72ch;font:calc(clamp(15px,3.4dvh,26px)*var(--scale))/1.38 Georgia,serif;white-space:pre-wrap}
#next{position:absolute;right:19px;bottom:13px;color:var(--amber);font-size:1.15rem}
#choices{max-height:67dvh;overflow:auto;padding:clamp(10px,2.5dvh,20px) clamp(12px,2.8vw,30px);display:grid;gap:5px;background:linear-gradient(112deg,#131a20fa,#211b19f6);border:1px solid var(--line);border-top:2px solid #bc9370;box-shadow:0 10px 45px #000a}
.choice-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--amber);font:clamp(1rem,4dvh,1.6rem) Georgia,serif}
.choice-context{margin:0 0 4px;color:#cfc0af;font:clamp(.8rem,2.9dvh,1rem)/1.35 Georgia,serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#choices button{text-align:left;background:#ffffff08;border:1px solid #ffffff28;border-left:2px solid #bb865b;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:clamp(.83rem,3.3dvh,1.03rem)}
#choices button:not(:disabled)::after{content:'›';color:var(--amber);font-size:1.32em;line-height:1}
#choices button:hover,#choices button:focus-visible{background:#5b3e2c;border-color:#e7b678}
.choice-time{font: .78rem system-ui,sans-serif;color:var(--paper);white-space:nowrap}
progress{width:100%;height:9px;accent-color:var(--amber)}
#popup{z-index:9} #activity{z-index:8}
#activity.full{padding:0;display:block;background:#111820}
#activity.full canvas{width:100%;height:100%;touch-action:none;display:block}
.mini-bar{position:absolute;inset:max(8px,env(safe-area-inset-top)) 12px auto;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
.mini-bar span,.mini-bar button{padding:8px 12px;background:#10151ae0;border:1px solid var(--line)} .mini-bar button{pointer-events:auto}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}

.messages{display:flex;flex-direction:column;gap:6px;max-height:27dvh;overflow:auto;margin:10px 0}

.answers{display:grid;gap:6px;margin:8px 0}
#activity.phone-activity{padding:0;overflow:hidden;background:linear-gradient(90deg,#0a0b118f,#070a10c9);align-items:flex-start;justify-content:center}
#game:has(.phone-activity:not([hidden])) #cast{opacity:.16;filter:blur(3px)}
#game:has(.phone-activity:not([hidden])) #hud{visibility:hidden}
.phone-stage{position:relative;top:2px;height:min(123dvh,880px);aspect-ratio:3/4;isolation:isolate}
.phone-art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 10px 25px #000b)}
.phone-glass{position:absolute;inset:2.85% 21.1% 22% 24.5%;background:#101a25;color:#e5edf4;border:1px solid #53708551;border-radius:clamp(10px,2.7dvh,23px);padding:clamp(5px,1.25dvh,12px);display:flex;flex-direction:column;overflow:hidden;box-shadow:inset 0 1px 15px #070a10a9}
.phone-header{display:flex;align-items:center;justify-content:space-between;gap:5px;padding:2px 2px 5px;border-bottom:1px solid #4b6d7c68;font-weight:700;font-size:clamp(.8rem,3dvh,1.3rem)}
.phone-header button{background:transparent;min-height:30px;padding:2px 6px;font-size:.72rem}
.phone-glass .messages{flex:1;min-height:42px;max-height:none;margin:4px 0;gap:4px;font-size:clamp(.69rem,2.75dvh,.95rem);overscroll-behavior:contain}
.phone-glass .bubble{padding:4px 7px}
.phone-glass .bubble.arrives{animation:message-in .21s ease-out}

.phone-glass .answers button{min-height:30px;padding:3px 5px;background:#173042;border-color:#7dc4d85b;text-align:left;font-size:clamp(.68rem,2.7dvh,.93rem)}
.phone-glass .answers button:hover,.phone-glass .answers button:focus-visible{background:#285269}
.phone-changes{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));max-width:32vw;z-index:2}
.phone-timer{font-size:clamp(.58rem,2.25dvh,.82rem);color:#bad7dc}
.phone-tabs{display:flex;gap:3px;margin:4px 0;flex-wrap:wrap}
.phone-tabs button,.phone-content button{background:#172a39;padding:4px 6px;min-height:30px;font-size:clamp(.67rem,2.45dvh,.9rem);text-align:left}
.phone-tabs button{flex:1}
.phone-content button{flex:none;width:100%}

.phone-content{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:4px;overscroll-behavior:contain;font-size:clamp(.7rem,2.6dvh,.95rem)}
.phone-content .messages{flex:none;overflow:visible}
.phone-content img{width:100%;border-radius:4px}
.phone-content p{margin:4px 1px;line-height:1.35}
.phone-close{margin-top:5px;min-height:32px;font-size:.76rem}
.camera-console{max-width:min(1100px,100%);display:grid;grid-template-columns:minmax(0,1.65fr) minmax(190px,1fr);gap:clamp(10px,2.3vw,27px)}
.camera-console h2{font-size:clamp(1.35rem,4.8dvh,2.6rem)}
.camera-view{aspect-ratio:16/9;position:relative;display:grid;place-items:center;align-self:start;overflow:hidden;isolation:isolate;background:#0a0e10;border:1px solid #ddeae94a}
.camera-view img{width:100%;height:100%;object-fit:contain;filter:grayscale(1) contrast(.94)}
.camera-view::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#00121833 3px 4px)}
.camera-time{z-index:1;position:absolute;top:7px;left:9px;color:#d9fbdf;background:#10251edb;padding:3px 6px;font-family:monospace;font-size:clamp(.8rem,3dvh,1.4rem)}
.camera-tools{display:flex;flex-direction:column;min-width:0;gap:7px}
.camera-tools p{margin:0;color:var(--dim);font-size:clamp(.78rem,2.8dvh,1rem);line-height:1.32}
.camera-tools input{width:100%}
.camera-transport{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.camera-transport button,.camera-tools button{padding:4px 7px}
.storm-panel{max-width:690px;border-top-color:#afced8;background:linear-gradient(120deg,#18252bf5,#131921f5)}
.storm-panel h2{font-size:clamp(1.32rem,5.3dvh,2.55rem)}
.storm-panel .eyebrow{color:#b8d9e2}
.storm-panel .answers button{text-align:left;background:#1b2b35;border-left:2px solid #8eadb7}
.storm-panel .storm-prompt{color:var(--paper);min-height:2.2em}
.storm-panel footer{display:flex;align-items:center;gap:7px}
@media(max-height:400px){.camera-console{gap:9px;padding:9px}.camera-tools{gap:4px}.camera-tools .eyebrow{display:none}.camera-tools button{min-height:37px}}
.phone-stage.fallback{height:98dvh;aspect-ratio:3/4}
.phone-stage.fallback .phone-glass{inset:4% 3% 5%;border:5px solid #31373c}

@media(max-height:390px){.phone-glass{padding:4px}.phone-header button{min-height:26px}.phone-glass .answers button{min-height:28px}.phone-glass .messages{min-height:34px}}

.pulse.beat{box-shadow:0 0 0 12px #b976553d;background:#80493a}

input[type=range]{width:min(43%,200px);accent-color:var(--amber);touch-action:none}

<section id="novella-loader" aria-labelledby="novella-loading-title">
  <div class="novella-loading-card">
    <img src="./icons/icon-192.png" width="62" height="62" alt="">
    <h1 id="novella-loading-title">После семи</h1>
    <p id="novella-loading-message" role="status">Готовим меню и первую сцену…</p>
    <progress aria-label="Загрузка новеллы"></progress>
    <button id="novella-load-retry" type="button" hidden>Повторить загрузку</button>
    <noscript>Включи JavaScript для запуска новеллы.</noscript>
  </div>
</section>
<script>
(() => {
  const loader = document.getElementById('novella-loader');
  const retry = document.getElementById('novella-load-retry');
  retry.addEventListener('click', () => location.reload());
  window.setTimeout(() => {
    if (loader.hidden) return;
    document.getElementById('novella-loading-message').textContent = 'Загрузка занимает дольше обычного. Можно повторить.';
    retry.hidden = false;
  },10000);
})();
</script>

const CHAPTER = {

          "t": "say",
          "who": "maxim",
          "text": "Свою допиши. Я завтра чайник верну, заодно скотч нормальный попрошу. Ещё один вечер на честном слове эта табличка не провисит.",
          "emo": "smile",
          "pos": "left",
          "outfit": "casual"
        },
        {
          "t": "say",
          "who": "robert",
          "text": "Хочешь, чтобы к тебе приходили точно по адресу?",

          "pos": "left",
          "outfit": "casual"

    "oct_vet": {

      still.alt = frame.caption || 'Кадр с камеры';
      timestamp.textContent = frame.time;
      summary.textContent = frame.caption || '';
      slider.value = memo.index;
      previous.disabled = memo.index === 0;
      next.disabled = memo.index === frames.length-1;
      const marked = memo.marked.includes(memo.index);
      record.disabled = marked || !frame.note;
      record.textContent = marked ? 'Кадр в журнале' : 'Зафиксировать кадр';
      progress.textContent = 'Кадр '+(memo.index+1)+' из '+frames.length+' · В журнале '+memo.marked.length;
    }
    function seek(index) {
      stop();
      if (index !== memo.index) Audio.play('sfx_tape');
      memo.index = clamp(index,0,frames.length-1);
      render(); save();
    }
    function stop() {
      playing = false; cancel(); playback.textContent = 'Смотреть';
    }
    function start() {
      if (!pauseAllowed()) return;
      if (memo.index === frames.length-1) memo.index=0;
      playing = true; playback.textContent = 'Стоп';
      Audio.play('sfx_tape'); render(); save();
      function tick() {
        cancel = clock(1350,null,() => {
          if (memo.index === frames.length-1) return stop();
          memo.index++; render(); save();
          tick();
        });
      }
      tick();
    }
  },
  phone_hub(done,step) {
    const phone = step.phone;
    const {glass,header,caption} = mountPhone(phone.title || 'Телефон');
    button('Пауза',showPause,header);
    const tabs = element('div',undefined,'phone-tabs');
    const body = element('div',undefined,'phone-content');
    glass.append(tabs,body);
    button('Убрать телефон',() => { delete state.phoneHub; done(); },glass,'phone-close primary');
    const memo = state.phoneHub ||= {replies:{},seen:{}};
    const sections = [
      {key:'threads',label:'Чаты',item:chat},
      {key:'gallery',label:'Фото',item:photo},
      {key:'calls',label:'Звонки',item:call}
    ].filter(section => phone[section.key]?.length);
    const headers = new Map();
    let active;
    const card = (text,sent) => element('span',text,'bubble'+(sent?' sent':''));
    for (const section of sections) headers.set(section.key,button(section.label,() => select(section),tabs));
    if (sections.length) select(sections[0]);
    Audio.play('sfx_phone_notify');

    function select(section) {
      active = section;
      caption.textContent = phone.title || 'Телефон';
      body.replaceChildren();
      body.scrollTop = 0;
      for (const [key,control] of headers) control.setAttribute('aria-selected',String(key === section.key));
      phone[section.key].forEach((item,index) => {
        const label = item.name || item.title || (section.key === 'gallery' ? 'Фото '+(index+1) : section.label);
        button(label,() => {
          Audio.play('ui_choice');
          caption.textContent = label;
          body.replaceChildren();
          body.scrollTop = 0;
          button('‹ Назад',() => select(active),body);
          section.item(item,index);
        },body);
      });
    }
    function once(item,key) {
      if (memo.seen[key]) return;
      memo.seen[key] = true;
      apply(item.fx);
      if (item.flags) Object.assign(state.flags,item.flags);
      journal(item.journal);
      save();
    }
    function chat(thread,index) {
      const messages = element('div',undefined,'messages');
      messages.setAttribute('aria-live','polite');
      for (const message of thread.messages || []) messages.append(card(message.text,message.from === 'robert'));
      body.append(messages);
      const actions = element('div',undefined,'answers');
      body.append(actions);
      function reply(answer) {
        messages.append(card(answer.text,true));
        if (answer.reply) messages.append(card(answer.reply,false));
      }
      if (own(memo.replies,index)) {
        reply(thread.options[memo.replies[index]]);
        return;
      }
      (thread.options || []).forEach((answer,answerIndex) => button(answer.text,() => {
        if (own(memo.replies,index)) return;
        memo.replies[index] = answerIndex;
        once(answer,'answer_'+index);
        Audio.play('sfx_phone_send');
        reply(answer); actions.replaceChildren(); body.scrollTop = body.scrollHeight;
      },actions));
    }
    function photo(item,index) {
      const path = asset('cg',item.image,'jpg') || asset('bg',item.image,'jpg') || asset('items',item.image,'png');
      if (path) {
        const image = element('img'); image.alt = item.name || ''; image.src = path;
        body.append(image);
      }
      if (item.caption) body.append(element('p',item.caption));
      once(item,'gallery_'+index);
    }
    function call(item,index) {
      if (item.text) body.append(element('p',item.text));
      function listen() {Audio.play(item.sfx || 'sfx_phone_notify'); once(item,'call_'+index);}
      listen();
      if (item.sfx) button('Прослушать ещё раз',listen,body);
    }
  },
  phone(done) {
    const {glass,header} = mountPhone('Женя');
    const timerText = element('span',undefined,'phone-timer');
    header.append(timerText);
    button('Пауза',showPause,header);
    const thread = element('div',undefined,'messages');
    const replyTime = 12000;
    const time = element('progress'); time.max = replyTime;
    const answers = element('div',undefined,'answers');
    thread.setAttribute('aria-live','polite'); time.setAttribute('aria-label','Время ответа');
    glass.append(thread,time,answers);
    const remembered = state.miniPhone ||= {index:0,history:[]};
    let release = () => {};
    cleanActivity = () => release();
    function bubble(text,sent,remember = true) {
      if (remember) remembered.history.push([text,sent]);
      const node = element('span',text,'bubble'+(sent?' sent':''));
      if (remember) node.classList.add('arrives');
      thread.append(node); thread.scrollTop = thread.scrollHeight;
      return node;
    }
    for (const [text,sent] of remembered.history) bubble(text,sent,false);
    function startRound() {
      const round = phoneData[remembered.index];
      if (!round) {
        if (remembered.history.at(-1)?.[0] !== 'Спокойной ночи, друг.') bubble('Спокойной ночи, друг.',false);
        time.hidden = true;
        timerText.textContent = '';
        button('Убрать телефон',() => {delete state.miniPhone; done();},answers,'primary');
        save();
        return;
      }
      if (remembered.history.at(-1)?.[0] !== round.incoming) {
        bubble(round.incoming,false);
        Audio.play(remembered.index === 0 ? 'sfx_phone_notify' : 'sfx_phone_typing');
      }
      let chosen = false;
      function reply(pick) {
        if (chosen || !pauseAllowed()) return;
        chosen = true;
        release(); answers.replaceChildren();
        function finishReply() {
          if (!pick) {bubble('Роберт? Ты там?',false); apply({rel_zhenya:-2,sanity:-2});}
          else {
            bubble(pick[0],true); Audio.play('sfx_phone_send'); apply(pick[1]);
            if (pick[2]) bubble(pick[2],false);
            if (pick[3]) state.flags[pick[3]] = true;
          }
          remembered.index++;
          delete remembered.remaining;
          save();
          startRound();
        }
        if (pick && remembered.index === 1 && settings.flash) {
          const flicker = bubble('хорошо — это не ответ',false,false);
          release = clock(150,null,() => {flicker.remove(); finishReply();});
        } else finishReply();
      }
      for (const pick of round.replies) button(pick[0],() => reply(pick),answers);
      const remaining = clamp(remembered.remaining ?? replyTime,1,replyTime);
      let lastSavedAt = 0;
      function update(ms) {
        remembered.remaining = remaining-ms;
        time.value = remembered.remaining;
        timerText.textContent = Math.ceil(time.value/1000)+' с';
        if (ms-lastSavedAt >= 600) { lastSavedAt = ms; save(); }
      }
      update(0);
      release = clock(remaining,update,() => reply(null));
      save();
    }
    startRound();
  },
  shop(done) {
    const card = miniCard('Альянс','Отметь покупки. Деньги спишутся при оплате.');
    const selected = new Set(), options = element('div',undefined,'products'), total = element('p','','notice');
    let cost = 0;
    card.append(options,total);
    const rows = products.map(product => {
      const toggle = button(product[0]+' · '+product[1]+' ₽',() => {
        if (selected.has(product)) {selected.delete(product); cost -= product[1];}
        else if (cost+product[1] <= state.stats.money) {selected.add(product); cost += product[1];}
        refresh();
      },options);
      return {product,toggle};
    });
    const pay = button('Уйти без покупок',() => {
      Audio.play(selected.size ? 'sfx_cash_register' : 'ui_choice');
      apply({money:-cost});
      for (const [,,,delta] of selected) apply(delta);
      for (const product of selected) state.flags[product[2]] = true;
      done();
    },card,'primary');
    const reply = element('p',undefined,'notice');
    const request = button('Попросить у мамы на хрумку и газяву',() => {
      reply.textContent = askMom();
      refresh();
    },card);
    card.append(reply);
    function refresh() {
      total.textContent = 'Корзина '+cost+' ₽  ·  Останется '+(state.stats.money-cost)+' ₽';
      pay.textContent = cost ? 'Оплатить' : 'Уйти без покупок';
      request.hidden = !!state.flags['mom_transfer_'+chapterOf(state.scene)];
      for (const {product,toggle} of rows) {
        toggle.setAttribute('aria-pressed',String(selected.has(product)));
        toggle.disabled = !selected.has(product) && cost + product[1] > state.stats.money;
      }
    }
    refresh();
  },
  flashlight(done) {
    const view = $('activity');
    view.classList.add('full');
    const canvas = element('canvas');
    canvas.setAttribute('aria-label','Пустырь. Найди три улики фонариком.');
    const context = canvas.getContext('2d');
    if (!context) {
      button('К гаражам',done,miniCard('Пустырь','Фонарь дрогнул. Дальше — гаражи.'),'primary');
      view.classList.remove('full');
      return;
    }
    const bar = element('div',undefined,'mini-bar'), count = element('span'), controls = element('span');
    bar.append(count,controls); view.append(canvas,bar);
    const exit = button('К гаражам',finish,controls); exit.hidden = true;
    button('Пауза',showPause,controls);
    const field = new Image();
    const bg = asset('bg','bg_wasteland','jpg'); if (bg) field.src = bg;
    for (const clue of clues) {
      clue.image = new Image();
      const path = asset('items',clue.asset,'png'); if (path) clue.image.src = path;
    }
    const cursor = {x:.5,y:.7};
    const dwell = new Map();
    let cancel = () => {}, doneAlready = false, latest = 0, shadowSpent = -1, shadowDwell = 0;
    let notice = '', noticeEnd = 0;
    function locate(event) {
      const rect = canvas.getBoundingClientRect();
      cursor.x = clamp((event.clientX-rect.left)/rect.width,0,1);
      cursor.y = clamp((event.clientY-rect.top)/rect.height,0,1);
    }
    canvas.onpointermove = locate;
    canvas.onpointerdown = event => {locate(event); canvas.setPointerCapture?.(event.pointerId);};
    function finish() {
      if (doneAlready) return;
      doneAlready = true;
      cancel();
      if (state.flags.items_found >= 3) apply({sanity:-6});
      done();
    }
    function frame(ms) {
      const dt = ms - latest; latest = ms;
      const width = Math.max(1,canvas.clientWidth), height = Math.max(1,canvas.clientHeight);
      const dpr = Math.min(2,devicePixelRatio || 1);
      if (canvas.width !== Math.round(width*dpr) || canvas.height !== Math.round(height*dpr)) {
        canvas.width = Math.round(width*dpr); canvas.height = Math.round(height*dpr);
      }
      context.setTransform(dpr,0,0,dpr,0,0);
      context.globalCompositeOperation = 'source-over';
      context.fillStyle = '#070b0d'; context.fillRect(0,0,width,height);
      const x = cursor.x * width, y = cursor.y * height;
      const radius = Math.min(width,height)*.19*(state.flags.flashlight_bought?1.6:1);
      context.save();
      context.beginPath(); context.arc(x,y,radius,0,Math.PI*2); context.clip();
      context.fillStyle='#303b37'; context.fillRect(0,0,width,height);
      if (field.complete && field.naturalWidth) context.drawImage(field,0,0,width,height);
      for (const clue of clues) {
        if (state.flags[clue.key]) continue;
        const px = clue.x*width, py = clue.y*height;
        const inLight = Math.hypot(x-px,y-py) < radius*.8;
        const hold = inLight ? (dwell.get(clue.key)||0)+dt : 0;
        dwell.set(clue.key,hold);
        if (clue.image.complete && clue.image.naturalWidth) context.drawImage(clue.image,px-13,py-16,26,32);
        context.strokeStyle='#eedaa7'; context.lineWidth=1.7;
        context.beginPath(); context.arc(px,py,17,-Math.PI/2,Math.PI*2*(hold/650)-Math.PI/2+.25); context.stroke();
        if (hold < 650) continue;
        state.flags[clue.key] = true;
        state.flags.items_found = clues.filter(item => state.flags[item.key]).length;
        if (clue.key === 'footprint_found') state.flags.truth_robert = (state.flags.truth_robert||0)+1;
        journal(clue.note); apply(clue.delta);
        notice = clue.name; noticeEnd = ms+1800;
        if (state.flags.items_found < 3) save();
      }
      const shadowId = Math.floor(ms/10000);
      if ([1,2].includes(shadowId) && ms % 10000 < 3000 && shadowId !== shadowSpent) {
        const shadowX = width*(shadowId === 1?.075:.935), shadowY = height*.56;
        context.fillStyle='#070c10'; context.beginPath(); context.ellipse(shadowX,shadowY,12,55,-.25,0,Math.PI*2); context.fill();
        shadowDwell = Math.hypot(x-shadowX,y-shadowY)<radius*.8 ? shadowDwell+dt : 0;
        if (shadowDwell >= 1000) {shadowSpent = shadowId; shadowDwell = 0; apply({sanity:-2}); save();}
      } else shadowDwell = 0;
      const fade = context.createRadialGradient(x,y,radius*.46,x,y,radius);
      fade.addColorStop(0,'#131b2200'); fade.addColorStop(1,'#070b0d');
      context.fillStyle=fade; context.fillRect(x-radius,y-radius,radius*2,radius*2);
      context.restore();
      const left = Math.ceil((40000-ms)/1000);
      count.textContent = 'Улики '+state.flags.items_found+'/3 · '+left+' с'+(noticeEnd>ms?' · '+notice:'');
      exit.hidden = ms < 30000;
      if (state.flags.items_found >= 3) finish();
    }
    cancel = clock(40000,frame,finish);
    cleanActivity = () => cancel();
  },
  pulse(done) {
    const card = miniCard('Дыши тише','Нажми «Выдох» один раз за такт, пока кольцо светится. Нужно поймать четыре из шести.');
    const period = 1600, first = 450, last = 1150, rounds = 6;
    let cycle = 0, phase = 0, score = 0, attempted = -1;
    const beat = button('Выдох',() => {
      if (!pauseAllowed() || cycle >= rounds || attempted === cycle) return;
      attempted = cycle;
      const hit = phase >= first && phase <= last;
      if (hit) score++;
      result.textContent = hit ? 'В такт.' : 'Мимо. Следующий вдох.';
      Audio.play(hit ? 'ui_choice' : 'ui_timer_tick');
    },card,'pulse');
    const progress = element('progress'); progress.max = period; progress.setAttribute('aria-label','Такт дыхания');
    const result = element('p','Приготовься.','notice');
    const marker = element('p','Такт 1 из 6 · Поймано 0');
    card.append(progress,marker,result);
    beat.focus();
    const stop = clock(period*rounds,ms => {
      const next = Math.min(rounds-1,Math.floor(ms/period));
      phase = ms % period;
      progress.value = phase;
      if (next !== cycle) {
        cycle = next;
        Audio.play('sfx_heartbeat_slow');
      }
      beat.classList.toggle('beat',phase >= first && phase <= last && attempted !== cycle);
      beat.textContent = phase >= first && phase <= last ? 'Выдох' : 'Вдох';
      marker.textContent = 'Такт '+(cycle+1)+' из '+rounds+' · Поймано '+score;
    },() => {
      state.flags.pulse_ok = score >= 4;
      apply(state.flags.pulse_ok ? {courage:4} : {sanity:-6,courage:-2});
      done();
    });
    cleanActivity = stop;
  },
  radio(done) {
    const card = miniCard('Радиоприёмник','Ищи сигнал по индикатору, затем задержись на частоте. Разборчивую фразу можно записать.');
    const dial = button('',()=>{},card,'dial');
    dial.setAttribute('aria-label','Ручка настройки');
    const range = element('input'); range.type='range'; range.min=87.5; range.max=108; range.step=.1; range.value=87.5;
    range.setAttribute('aria-label','Частота радиоприёмника');
    const number = element('span',' 87,5 МГц');
    const meter = element('meter',undefined,'signal-meter');
    meter.min=0; meter.max=100; meter.setAttribute('aria-label','Сила сигнала');
    const tuning = element('div',undefined,'signal-steppers');
    const fragment = element('p','Ш-ш-ш…','notice');
    const bar = element('footer');
    card.append(range,meter,tuning,fragment,bar);
    const shift = delta => {
      range.value=clamp(Number(range.value)+delta,87.5,108);
      draw();
    };
    button('−0,1',() => shift(-.1),tuning);
    tuning.append(number);
    button('+0,1',() => shift(.1),tuning);
    let signal=null, selected=null, cursor=null, before=0, first=true, previousStatic=-500;
    const note = button('Записать в журнал',() => {
      if (!signal || state.flags[signal[2]]) return;
      state.flags[signal[2]] = true;
      state.flags.radio_notes = (state.flags.radio_notes || 0) + 1;
      journal('Радио: '+signal[1]);
      note.hidden=true; save();
    },bar);
    note.hidden=true;
    const leave=button('Выключить радио',() => {
      if (state.flags.radio_notes && !state.flags.radio_calm_applied) {
        state.flags.radio_calm_applied = true;
        apply({sanity:2});
      }
      Audio.play('sfx_radio_off'); done();
    },bar,'primary');
    const draw = () => {
      const value = Number(range.value);
      number.textContent=' '+value.toFixed(1).replace('.',',')+' МГц';
      dial.style.transform='rotate('+Math.round((value-87.5)/20.5*270-135)+'deg)';
      const gap = Math.min(...stations.map(station => Math.abs(value-station[0])));
      meter.value = Math.round(clamp(1-gap/2,0,1)*100);
      meter.title = 'Сигнал '+meter.value+'%';
    };
    range.oninput = draw;
    dial.onpointerdown = event => {cursor=[event.clientX,event.clientY,Number(range.value)]; dial.setPointerCapture?.(event.pointerId);};
    dial.onpointermove = event => {
      if (!cursor) return;
      range.value=clamp(cursor[2]+(event.clientX-cursor[0]+cursor[1]-event.clientY)*.072,87.5,108);
      draw();
    };
    dial.onpointerup = dial.onpointercancel = () => cursor=null;
    dial.onkeydown = event => {
      if (!['ArrowLeft','ArrowRight','ArrowDown','ArrowUp'].includes(event.key)) return;
      event.preventDefault();
      range.value=clamp(Number(range.value)+(['ArrowRight','ArrowUp'].includes(event.key)?.3:-.3),87.5,108); draw();
    };
    draw();
    Audio.melody('distorted',.59);
    const hasRecording = Audio.radio(true);
    const stop=clock(100000000,ms => {
      const candidate = stations.find(station => Math.abs(Number(range.value)-station[0]) <= .35) || null;
      if (candidate !== selected) {selected=candidate; before=ms; signal=null;Audio.radioLevel(false);}
      if (selected && ms-before >= 750 && !signal) {
        signal=selected;
        Audio.radioLevel(true);
        Audio.play('sfx_radio_fragment');
        if (signal[2] === 'radio_time') {state.flags.radio_heard_time=true;save();}
        if (first && settings.scares && settings.shake) {
          first=false;
          $('world').classList.remove('shake'); void $('world').offsetWidth; $('world').classList.add('shake');
        }
      }
      if (!hasRecording && !signal && ms-previousStatic >= 390) {previousStatic=ms; Audio.play('sfx_radio_static');}
      fragment.textContent=signal ? signal[1] : selected ? 'Ш-ш…' : 'Ш-ш-ш…';
      note.hidden=!signal || !!state.flags[signal[2]];
    },()=>{});
    cleanActivity = () => {stop();Audio.radio(false);};
  }
};
boot();
document.getElementById('novella-loader').hidden=true;
</script>
</body>
